# ZeroClaw has no YAML SOP format. A SOP is a directory holding SOP.toml plus
# an optional SOP.md (docs sop/syntax.md:5-14, sop/how-it-works.md:5). This
# file is that manifest; the steps live in SOP.md next to it.
#
# Fields below come from SopMeta (crates/zeroclaw-runtime/src/sop/types.rs:607-633)
# and SopTrigger (types.rs:142-218), because the docs deliberately do not
# enumerate manifest fields (sop/syntax.md:16-25).
#
# admission_policy = "hold" serializes runs: a tick that arrives while the
# previous reconcile is still working is deferred, never overlapped
# (sop/syntax.md:43-45). Two concurrent passes over one ledger record would
# race on the write-back.

[sop]
name = "reconcile"
description = "Polls Solana RPC every two minutes for payments against open Baixa invoices and closes the ones that verify."
version = "0.1.0"

# execution_mode is REQUIRED here and must be "auto". The global
# [sop] default_execution_mode is "supervised", and supervised means
# "request approval before step 1 of every run"
# (sop/engine.rs:5456-5459), not "run, but carefully". A cron SOP has
# nobody to answer that prompt, so under the default every one of the
# 720 daily runs would park at step 1 and never reach the chain.
# [sop] approval_mode = "out_of_band_required" makes it worse by design:
# the agent cannot clear its own gate, so the runs would pile up until a
# human cleared each from the CLI.
#
# "auto" does not remove the human gate this SOP actually needs.
# step_requires_approval_gate (sop/engine.rs:5473-5476) returns true for
# any step carrying requires_confirmation regardless of mode, and
# pending_step_blocks_direct_advance (:5483-5485) does the same for
# kind = checkpoint. Step 7 carries both, so the destination-mismatch
# gate still stops the run under "auto" while steps 1 to 6 proceed
# unattended. That is the intended shape: autonomous by default, one
# explicit gate where money is implicated.
#
# The global default stays "supervised" on purpose, so any future SOP
# dropped into this directory is gated until someone opts it out here.
execution_mode = "auto"
agent = "baixa"
max_concurrent = 1
admission_policy = "hold"

# Cron granularity: 5-field crontab is normalized to 6-field by prepending a
# seconds field (crates/zeroclaw-runtime/src/sop/dispatch.rs:1252-1253).
# Firing is driven by the SOP maintenance tick, whose period is
# [sop] maintenance_interval_secs (default 60, schema.rs:22586-22593), so this
# 2-minute schedule sits safely above the poll rate.
[[triggers]]
type = "cron"
expression = "*/2 * * * *"
