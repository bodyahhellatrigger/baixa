# Manifest for the daily_digest SOP. See sops/reconcile/SOP.toml for why this
# is TOML plus a sibling SOP.md rather than a single YAML file.
#
# Fires 08:00 UTC = 09:00 local for an operator at UTC+1.
#
# The SOP cron trigger variant carries NO `tz` field
# (crates/zeroclaw-runtime/src/sop/types.rs:161-164), unlike declarative
# [cron.<alias>] jobs which do (schema.rs:12776-12780). Window evaluation runs
# against chrono::Utc::now() (dispatch.rs:1317), so this expression is UTC and
# the offset has to be baked into the hour by hand.
#
# Operators outside UTC+1: subtract your offset from the wall-clock hour you
# want. This also means the digest does not follow daylight saving — at UTC+2
# in summer it arrives at 10:00 local until you edit the hour.
#
# The expression is 5-field and gets normalized to 6-field at parse time
# (crates/zeroclaw-runtime/src/sop/dispatch.rs:1252-1253).

[sop]
name = "daily_digest"
description = "Sends the operator one daily summary of the Baixa ledger: paid today, still open with age, flagged items with reasons, and the running total received."
version = "0.1.0"

# execution_mode is REQUIRED here and must be "auto". The global
# [sop] default_execution_mode is "supervised", and supervised means
# "request approval before step 1 of every run"
# (sop/engine.rs:5456-5459), not "run, but carefully". A cron SOP has
# nobody to answer that prompt, so under the default every one of the
# 720 daily runs would park at step 1 and never reach the chain.
# [sop] approval_mode = "out_of_band_required" makes it worse by design:
# the agent cannot clear its own gate, so the runs would pile up until a
# human cleared each from the CLI.
#
# "auto" does not remove the human gate this SOP actually needs.
# step_requires_approval_gate (sop/engine.rs:5473-5476) returns true for
# any step carrying requires_confirmation regardless of mode, and
# pending_step_blocks_direct_advance (:5483-5485) does the same for
# kind = checkpoint. Step 7 carries both, so the destination-mismatch
# gate still stops the run under "auto" while steps 1 to 6 proceed
# unattended. That is the intended shape: autonomous by default, one
# explicit gate where money is implicated.
#
# The global default stays "supervised" on purpose, so any future SOP
# dropped into this directory is gated until someone opts it out here.
execution_mode = "auto"
agent = "baixa"
max_concurrent = 1
admission_policy = "hold"

# NO CRON TRIGGER BLOCK HERE, AND THAT IS DELIBERATE.
#
# A cron trigger on a SOP does fire, but nothing executes the run. The daemon
# maintenance tick calls process_headless_results (src/main.rs:7952), which is
# a logger: every branch records a line and returns. For an LLM step it records
# "ready for step 1 ... but no agent loop available to execute" and leaves the
# run Running forever. record_started_run states it outright
# (sop/dispatch.rs:283-289): only execution_mode = "deterministic" is driven to
# a terminal state, because deterministic steps need no LLM. Anything else
# holds its max_concurrent slot indefinitely, so the SOP fires exactly once and
# every later tick is skipped with "cooldown or concurrency limit reached".
#
# Deterministic mode is not open to this SOP. The builtin capabilities are
# approval.wait, json.validate, shell.exec, git.status, git.diff and
# notify.channel (sop/capability/builtins.rs:102-244). None of them speak HTTP,
# and reconcile exists to query Solana RPC.
#
# The run is therefore started by a declarative cron agent job
# ([cron.reconcile] in config.toml, CronJobDecl at schema.rs:12687-12723),
# which runs inside a real agent turn. That job calls sop_execute to open a run
# and sop_advance to walk it, so this file keeps its steps, its output
# contracts and its step 7 checkpoint. SPEC.md 3.8 named this path the fallback
# if the SOP tick proved flaky. It did.
